########################################
# Rendering
########################################

# Intel GPU: use OpenGL rather than XRender.
backend = "glx";

# Synchronise presentation to the display.
vsync = true;

# Keep Picom's frame pacing enabled.
# This is enabled by default, but making it explicit
# documents what we want.
frame-pacing = true;


########################################
# Shadows
########################################

shadow = true;

shadow-radius = 12;
shadow-opacity = 0.35;

shadow-offset-x = -6;
shadow-offset-y = -6;

shadow-color = "#000000";


########################################
# Fading
########################################

fading = true;

fade-in-step = 0.035;
fade-out-step = 0.035;
fade-delta = 8;

########################################

# Window animations — fade style

########################################

animations = (
    # New windows gently fade in.
    {
        triggers = [ "open" ];
        preset = "appear";
        scale = 1.0;
        duration = 0.16;
    },

    # Closing windows gently fade out.
    {
        triggers = [ "close" ];
        preset = "disappear";
        scale = 1.0;
        duration = 0.14;
    },

    # Windows appearing when switching Qtile groups
    # fade in without moving.
    {
        triggers = [ "show" ];
        preset = "appear";
        scale = 1.0;
        duration = 0.18;
    },

    # Windows disappearing when switching Qtile groups
    # fade out without moving.
    {
        triggers = [ "hide" ];
        preset = "disappear";
        scale = 1.0;
        duration = 0.18;
    }
);


