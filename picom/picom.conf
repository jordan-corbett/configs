########################################
# Performance / fullscreen
########################################

# Don't unredirect fullscreen windows.
# This avoids transitions suddenly changing compositor
# behaviour when entering/leaving fullscreen.
unredir-if-possible = false;


########################################
# Window types
########################################

wintypes:
{
    tooltip = { fade = true; shadow = true; opacity = 0.95; focus = true; };
    dock = { shadow = false; clip-shadow-above = true; }
    dnd = { shadow = false; }
    popup_menu = { opacity = 0.98; }
    dropdown_menu = { opacity = 0.98; }
};
